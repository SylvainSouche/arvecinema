# CI - runs on every PR and push to master.
#
# Jobs:
#   1. lint-and-test - typecheck + vitest unit tests + smoke tests
#   2. build         - electron-vite build (verifies the app compiles)

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Typecheck + Unit Tests + Smoke Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run i18n smoke test
        run: node scripts/smoke-test-i18n.mjs

      - name: Run logger smoke test
        run: node scripts/smoke-test-logger.mjs

  build:
    name: Build (electron-vite)
    runs-on: ubuntu-22.04
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
