<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./assets/icon-64.png" />
    <link rel="apple-touch-icon" href="./assets/icon-256.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- CSP (SEC-03 fix): tightened — added base-uri, form-action, object-src,
         frame-src, dropped the cinema domains from connect-src (the renderer
         never calls them — all fetching is in the main process). -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   base-uri 'none';
                   form-action 'none';
                   object-src 'none';
                   frame-src 'none';
                   img-src 'self' https: data:;
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                   font-src 'self' https://fonts.gstatic.com;
                   script-src 'self';
                   connect-src 'self'" />
    <title>ArveCinema</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #0a0a0a;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Double-thumb slider: two overlaid native range inputs.
         Inputs themselves don't catch pointer events, only the thumbs do,
         so both sliders can occupy the same track without blocking each other. */
      .double-range-input {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        pointer-events: none;
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        outline: none;
      }
      /* WebKit thumb */
      .double-range-input::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        pointer-events: auto;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid #0a0a0a;
        cursor: pointer;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        transition: transform 0.1s ease;
      }
      .double-range-input::-webkit-slider-thumb:hover { transform: scale(1.15); }
      .double-range-input::-webkit-slider-thumb:active { transform: scale(1.25); }
      /* Hide the native track on WebKit */
      .double-range-input::-webkit-slider-runnable-track {
        background: transparent;
        height: 100%;
      }
      /* Firefox thumb */
      .double-range-input::-moz-range-thumb {
        pointer-events: auto;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid #0a0a0a;
        cursor: pointer;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      }
      .double-range-input::-moz-range-track { background: transparent; height: 100%; }

      /* Always-visible scrollbars (macOS hides them by default, which makes
         the weekly swimlane confusing). Force a thick visible track + thumb. */
      ::-webkit-scrollbar {
        width: 14px;
        height: 14px;
        -webkit-appearance: none;
      }
      ::-webkit-scrollbar-track {
        background: #111;
        border-left: 1px solid #222;
        border-top: 1px solid #222;
      }
      ::-webkit-scrollbar-thumb {
        background: #555;
        border-radius: 7px;
        border: 3px solid #111;
        min-width: 30px;
        min-height: 30px;
      }
      ::-webkit-scrollbar-thumb:hover { background: #777; }
      ::-webkit-scrollbar-thumb:active { background: #888; }
      ::-webkit-scrollbar-corner { background: #111; }
      /* Firefox */
      * { scrollbar-width: auto; scrollbar-color: #555 #111; }

      /* ── Theme system ───────────────────────────────────────────────────── */
      /* Dark (default): applied via data-theme="dark" on <html>.             */
      /* Light: applied via data-theme="light".                               */
      /* The CSS variables below override the hardcoded colors used in        */
      /* inline styles. We use !important because inline styles have higher   */
      /* specificity than CSS rules without it.                               */
      :root, [data-theme="dark"] {
        --bg-primary: #0a0a0a;
        --bg-card: #131313;
        --bg-card-2: #1a1a1a;
        --bg-header: #0a0a0a;
        --bg-input: #1a1a1a;
        --bg-pill: #262626;
        --bg-slider: #333;
        --bg-strip-active: #141414;
        --bg-strip-dim: #0a0a0a;
        --text-primary: #fff;
        --text-secondary: #bbb;
        --text-muted: #888;
        --text-dim: #666;
        --text-faint: #444;
        --border: #222;
        --border-light: #333;
      }
      [data-theme="light"] {
        --bg-primary: #e8e8e0;
        --bg-card: #ffffff;
        --bg-card-2: #f0f0e8;
        --bg-header: #d8d8d0;
        --bg-input: #e0e0d8;
        --bg-pill: #d0d0c8;
        --bg-slider: #bbb;
        --bg-strip-active: #e0e0d8;
        --bg-strip-dim: #d4d4cc;
        --text-primary: #1a1a1a;
        --text-secondary: #444;
        --text-muted: #666;
        --text-dim: #888;
        --text-faint: #aaa;
        --border: #ccc;
        --border-light: #bbb;
      }
      [data-theme="light"] body { background: var(--bg-primary) !important; }
      [data-theme="light"] ::-webkit-scrollbar-track { background: #e0e0d8; }
      [data-theme="light"] ::-webkit-scrollbar-thumb { background: #aaa; border-color: #e0e0d8; }
      [data-theme="light"] ::-webkit-scrollbar-thumb:hover { background: #888; }
      /* Firefox */
      [data-theme="light"] * { scrollbar-color: #aaa #e0e0d8; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
